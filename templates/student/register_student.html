{% extends "base.html" %}


{% block title %}Student Registration - Placement Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="bg-white-card shadow-lg p-5">
                <div class="text-center mb-5">
                    <h2 class="fw-bold text-success mb-3">Student Registration</h2>
                    <p class="text-muted">Fill in your details to create your placement profile.</p>
                </div>

                <form action="{{ url_for('register_student') }}" method="POST" enctype="multipart/form-data">
                    <div class="row">
                        <!-- Account Details Column -->
                        <div class="col-md-6 border-end pe-md-4">
                            <h5 class="fw-bold mb-4 border-bottom pb-2 text-primary">Account Details</h5>
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold small">Username</label>
                                <input type="text" class="form-control" id="username" name="username"
                                    placeholder="Choose a unique username" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold small">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="student@university.edu" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold small">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- Personal Information Column -->
                        <div class="col-md-6 ps-md-4">
                            <h5 class="fw-bold mb-4 border-bottom pb-2 text-primary">Personal & Academic info</h5>
                            <div class="mb-3">
                                <label for="full_name" class="form-label fw-bold small">Full Name</label>
                                <input type="text" class="form-control" id="full_name" name="full_name"
                                    placeholder="Enter your full name" required>
                            </div>
                            <div class="mb-3">
                                <label for="contact_number" class="form-label fw-bold small">Contact Number</label>
                                <input type="text" class="form-control" id="contact_number" name="contact_number"
                                    placeholder="+91 1234567890" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="department" class="form-label fw-bold small">Department</label>
                                    <input type="text" class="form-control" id="department" name="department"
                                        placeholder="Computer Science">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cgpa" class="form-label fw-bold small">Current CGPA</label>
                                    <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa"
                                        placeholder="9.5">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="mb-4">
                                <label for="resume" class="form-label fw-bold small">Upload Resume (PDF/DOCX)</label>
                                <input type="file" class="form-control" id="resume" name="resume"
                                    accept=".pdf,.doc,.docx">
                            </div>
                            <button type="submit" class="btn btn-success btn-lg-custom w-100 py-3 shadow-sm">Complete
                                Student Registration</button>
                        </div>
                    </div>
                </form>

                <div class="mt-5 text-center border-top pt-4">
                    <p class="small text-muted mb-0">Already have an account?
                        <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Login
                            here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
