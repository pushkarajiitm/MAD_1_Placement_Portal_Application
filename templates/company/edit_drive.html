{% extends 'base.html' %}

{% block title %}Edit Placement Drive{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom-0 pt-4 px-4">
                <h3 class="fw-bold mb-0">Edit Placement Drive</h3>
                <p class="text-muted small">Update the details for "{{ drive.job_title }}"</p>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('company.edit_drive', drive_id=drive.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold small mb-1">Job Title / Drive Name</label>
                        <input type="text" class="form-control" name="job_title" value="{{ drive.job_title }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold small mb-1">Job Description</label>
                        <textarea class="form-control" name="job_description" rows="4"
                            required>{{ drive.job_description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold small mb-2 d-block">Offered Roles & Packages</label>
                        <div id="roles-container">
                            {% for job in drive.offered_jobs %}
                            <div class="row g-2 mb-2 role-row">
                                <div class="col-7">
                                    <input type="text" class="form-control form-control-sm" name="role_titles[]"
                                        value="{{ job.role_title }}" placeholder="Role (e.g. SDE)" required>
                                </div>
                                <div class="col-4">
                                    <input type="number" step="0.01" class="form-control form-control-sm"
                                        name="packages[]" value="{{ job.package }}" placeholder="LPA" required>
                                </div>
                                <div class="col-1">
                                    <button type="button"
                                        class="btn btn-sm btn-outline-danger border-0 remove-role">&times;</button>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-primary mt-1" id="add-role-btn">+ Add
                            Another Role</button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold small mb-1">Eligibility Criteria</label>
                        <textarea class="form-control" name="eligibility_criteria" rows="2"
                            required>{{ drive.eligibility_criteria }}</textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small mb-1">Application Deadline</label>
                        <input type="date" class="form-control" name="application_deadline"
                            value="{{ drive.application_deadline.strftime('%Y-%m-%d') }}" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Update Drive</button>
                        <a href="{{ url_for('company.company_drives') }}"
                            class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>

                <script>
                    document.getElementById('add-role-btn').addEventListener('click', function () {
                        const container = document.getElementById('roles-container');
                        let newRow;
                        if (container.children.length > 0) {
                            newRow = container.firstElementChild.cloneNode(true);
                            newRow.querySelector('input[name="role_titles[]"]').value = '';
                            newRow.querySelector('input[name="packages[]"]').value = '';
                        } else {
                            // Create from scratch if empty
                            newRow = document.createElement('div');
                            newRow.className = 'row g-2 mb-2 role-row';
                            newRow.innerHTML = `
                                <div class="col-7">
                                    <input type="text" class="form-control form-control-sm" name="role_titles[]" placeholder="Role (e.g. SDE)" required>
                                </div>
                                <div class="col-4">
                                    <input type="number" step="0.01" class="form-control form-control-sm" name="packages[]" placeholder="LPA" required>
                                </div>
                                <div class="col-1">
                                    <button type="button" class="btn btn-sm btn-outline-danger border-0 remove-role">&times;</button>
                                </div>
                            `;
                        }
                        container.appendChild(newRow);
                        attachRemoveEvent(newRow.querySelector('.remove-role'));
                    });

                    function attachRemoveEvent(btn) {
                        btn.addEventListener('click', function () {
                            if (document.querySelectorAll('.role-row').length > 1) {
                                btn.closest('.role-row').remove();
                            } else {
                                alert("At least one role is required.");
                            }
                        });
                    }

                    document.querySelectorAll('.remove-role').forEach(attachRemoveEvent);
                </script>
            </div>
        </div>
    </div>
</div>
{% endblock %}
